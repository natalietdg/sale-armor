name: SaleArmor
options:
  bundleIdPrefix: com.natalieleong
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.10"
    # Read from the Apple Development certificate's OU field, not typed from memory.
    DEVELOPMENT_TEAM: "DC4T539CW7"
    # Filled in from RevenueCat → Project → API keys. Empty means the paywall reports that the
    # store is not configured rather than crashing.
    REVENUECAT_API_KEY: "appl_aywpPpYiohUOCbGxLTonQSkcwef"

# SIGNING — why each target repeats this instead of inheriting it
#
# XcodeGen writes its own defaults at *target* level for anything a target leaves unset, and a
# target-level default beats a project-level setting. Two of those defaults broke delivery:
#
#   CODE_SIGN_IDENTITY = "iPhone Developer"   pinned every build, archives included, to a
#       development profile. Development profiles need a registered device, so archiving died
#       with "your team has no devices" no matter how healthy the account was.
#   TARGETED_DEVICE_FAMILY = "1,2"            claimed iPad support, and an iPad-capable app that
#       declares portrait-only is rejected at upload for not supporting multitasking.
#
# Release signs manually against explicit App Store profiles ("SaleArmor AppStore" and
# "SaleArmorMonitor AppStore"), created through the App Store Connect API because Xcode-managed
# profiles are rejected under manual signing. Automatic signing kept resolving a *development*
# profile even when
# archiving and then refused the distribution identity as "conflicting", and blanking the identity
# to escape that left the archive unsigned — an unsigned archive exports with only the profile's
# minimum entitlements, silently dropping family-controls and the App Group, so the shield never
# raises. Naming the Store profile removes the guesswork. Debug stays automatic so running on a
# device still just works.

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

targets:
  SaleArmor:
    type: application
    platform: iOS
    # Shared/ is compiled into BOTH targets. The extension is a separate process and cannot see
    # the app's types, but it must read the same armed window and clear the same shield store.
    sources: [SaleArmor, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natalieleong.salearmor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"   # iPhone. Shielding is a phone habit, not an iPad one.
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "SaleArmor AppStore"
    entitlements:
      path: SaleArmor/SaleArmor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.natalieleong.salearmor
    info:
      path: SaleArmor/Info.plist
      properties:
        CFBundleDisplayName: Sale Armor
        # The RevenueCat *public* SDK key. Designed to ship inside the app, so it is not a secret,
        # but it differs per project — keeping it here means changing it is not a code edit.
        RevenueCatAPIKey: $(REVENUECAT_API_KEY)
        CFBundleShortVersionString: "1.0"
        # Build 2 predates the paywall, the cooling-off vault and the reminders.
        CFBundleVersion: "6"
        # Pixelify Sans, SIL Open Font Licence — free for commercial use. Chosen over Press Start
        # 2P because the app has real sentences in it and Press Start is unreadable below ~14pt.
        UIAppFonts:
          - PixelifySans.ttf
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: SaleArmorMonitor
        embed: true
      # The extension never sells anything, so only the app links this.
      - package: RevenueCat
        product: RevenueCat

  # The extension is what actually raises and drops the shield. The app only schedules it, so a
  # window still opens and closes correctly when the app is never launched that day.
  SaleArmorMonitor:
    type: app-extension
    platform: iOS
    sources: [SaleArmorMonitor, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natalieleong.salearmor.monitor
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "SaleArmorMonitor AppStore"
    entitlements:
      path: SaleArmorMonitor/SaleArmorMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.natalieleong.salearmor
    info:
      path: SaleArmorMonitor/Info.plist
      properties:
        CFBundleDisplayName: Sale Armor Monitor
        CFBundleShortVersionString: "1.0"
        # Must match the host app exactly or the upload is rejected.
        CFBundleVersion: "6"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldMonitor

  SaleArmorTests:
    type: bundle.unit-test
    platform: iOS
    # Shared/ only. The schedule and wishlist logic is deliberately free of UI and of
    # FamilyControls calls, so it can be tested without a device or a Screen Time grant.
    sources: [SaleArmorTests, Shared]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.natalieleong.salearmor.tests
        TARGETED_DEVICE_FAMILY: "1"
        # Tests never ship, so they never need a distribution identity.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

schemes:
  SaleArmor:
    build:
      targets:
        SaleArmor: all
        SaleArmorTests: [test]
    run:
      config: Debug
      # Local products, so the paywall can be exercised without App Store Connect.
      storeKitConfiguration: SaleArmor.storekit
    test:
      config: Debug
      targets:
        - SaleArmorTests
    # Without this the archive action inherits Debug and asks Apple for a *development* profile,
    # which needs a registered device. Distribution profiles do not.
    archive:
      config: Release
